<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dccaf2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#865db1;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" />
      <feOffset dx="1" dy="1" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="#fff" stroke="#dccaf2" stroke-width="1"/>
  
  <!-- Outer Lotus Petals -->
  <path d="M60 15 C75 40 105 50 110 70 C100 95 75 105 60 110 C45 105 20 95 10 70 C15 50 45 40 60 15 Z" 
        fill="url(#logoGradient)" filter="url(#shadow)" />
  
  <!-- Inner Lotus Detail -->
  <path d="M60 35 C70 50 85 55 90 70 C80 85 70 90 60 95 C50 90 40 85 30 70 C35 55 50 50 60 35 Z" 
        fill="#fff" opacity="0.4" />
  
  <!-- Center Bud -->
  <ellipse cx="60" cy="70" rx="8" ry="12" fill="#fff" opacity="0.8" />
</svg>
