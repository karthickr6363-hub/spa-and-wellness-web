<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Register - Sparlex Spa</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <link rel="icon" href="img/favicon.svg" type="image/svg+xml">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/lightbox/css/lightbox.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">


    <!-- Customized Bootstrap Stylesheet -->
    <link href="css/bootstrap.min.css" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

    <!-- Spinner Start -->
    <div id="spinner"
        class="show w-100 vh-100 bg-white position-fixed translate-middle top-50 start-50  d-flex align-items-center justify-content-center">
        <div class="spinner-grow text-primary" role="status"></div>
    </div>
    <!-- Spinner End -->


    <!-- Modal Search Start -->
    <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content rounded-0">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Search by keyword</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body d-flex align-items-center">
                    <form class="input-group w-75 mx-auto d-flex search-form">
                        <input type="search" class="form-control p-3" placeholder="keywords"
                            aria-describedby="search-icon-1">
                        <button type="submit" id="search-icon-1" class="input-group-text p-3"><i
                                class="fa fa-search"></i></button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Modal Search End -->


    <!-- Register Start -->
    <div class="container-fluid py-0 px-0">
        <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center"
            style="background: linear-gradient(rgba(127, 185, 166, 0.8), rgba(127, 185, 166, 0.8)), url('img/carousel-1.jpg') center/cover no-repeat;">
            <div class="row justify-content-center w-100 px-3 py-4">
                <div class="col-12 col-sm-10 col-md-8 col-lg-7 col-xl-6">
                    <div class="bg-white rounded shadow-lg p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="d-inline-flex align-items-center mb-2 text-decoration-none">
                                <img src="img/logo.svg" alt="Logo" class="img-fluid" style="height: 50px;">
                                <h1 class="brand-name display-6 mb-0 ms-2">Sparlex</h1>
                            </a>
                            <h4 class="mb-1">Create Account</h4>
                            <p class="text-muted small mb-0">Join our spa community today</p>
                        </div>

                        <form id="registerForm">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="firstName" placeholder="John"
                                            required>
                                        <label for="firstName">First Name</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" class="form-control" id="lastName" placeholder="Doe"
                                            required>
                                        <label for="lastName">Last Name</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-floating">
                                        <input type="email" class="form-control" id="emailInput"
                                            placeholder="name@example.com" required>
                                        <label for="emailInput">Email Address</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="passwordInput"
                                            placeholder="Password" required>
                                        <label for="passwordInput">Password</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="password" class="form-control" id="confirmPassword"
                                            placeholder="Confirm Password" required>
                                        <label for="confirmPassword">Confirm Password</label>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="form-check small">
                                        <input class="form-check-input" type="checkbox" id="agreeTerms" required>
                                        <label class="form-check-label" for="agreeTerms">
                                            I agree to the <a href="#" class="text-primary text-decoration-none">Terms
                                                and Conditions</a>
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 text-center">
                                    <button type="submit" class="btn btn-primary px-5 py-2 shadow-sm">Create
                                        Account</button>
                                </div>
                                <div class="col-12">
                                    <div class="d-flex align-items-center my-2">
                                        <hr class="flex-grow-1">
                                        <span class="mx-3 text-muted small text-uppercase">Or sign up with</span>
                                        <hr class="flex-grow-1">
                                    </div>
                                </div>
                                <div class="col-12">
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <button type="button"
                                                class="btn btn-outline-light border text-dark w-100 py-2 d-flex align-items-center justify-content-center"
                                                onclick="socialLogin('google')">
                                                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                                                    alt="Google" style="height: 18px;" class="me-2">
                                                <span class="small">Google</span>
                                            </button>
                                        </div>
                                        <div class="col-6">
                                            <button type="button"
                                                class="btn btn-outline-light border text-dark w-100 py-2 d-flex align-items-center justify-content-center"
                                                onclick="socialLogin('facebook')">
                                                <i class="fab fa-facebook-f text-primary me-2"></i>
                                                <span class="small">Facebook</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 text-center mt-4 pt-2 border-top">
                                    <p class="small mb-0 text-muted">Already have an account? <a href="login.html"
                                            class="text-secondary fw-bold text-decoration-none">Login</a></p>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Register End -->


    <!-- Back to Top -->
    <a href="#" class="btn btn-primary btn-primary-outline-0 btn-md-square rounded-circle back-to-top"><i
            class="fa fa-arrow-up"></i></a>


    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/counterup/counterup.min.js"></script>
    <script src="lib/lightbox/js/lightbox.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>

    <!-- Template Javascript -->
    <script src="js/main.js"></script>

    <!-- Register Form Validation -->
    <script>
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const firstName = document.querySelector('input[placeholder="John"]').value;
            const lastName = document.querySelector('input[placeholder="Doe"]').value;
            const email = document.querySelector('input[type="email"]').value;
            const password = document.querySelector('input[type="password"]').value;
            const confirmPassword = document.querySelector('input[placeholder="Confirm Password"]').value;
            const phone = document.querySelector('input[type="tel"]').value;
            const dob = document.querySelector('input[type="date"]').value;
            const agreeTerms = document.getElementById('agreeTerms').checked;

            // Validation
            if (!firstName || !lastName || !email || !password || !confirmPassword) {
                alert('Please fill in all required fields');
                return;
            }

            if (!email.includes('@')) {
                alert('Please enter a valid email address');
                return;
            }

            if (password.length < 6) {
                alert('Password must be at least 6 characters long');
                return;
            }

            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            if (!agreeTerms) {
                alert('Please agree to the Terms and Conditions');
                return;
            }

            // Simulate registration success
            alert('Registration successful! Redirecting to login...');
            // window.location.href = 'login.html';
        });

        // Social login function
        function socialLogin(provider) {
            // Simulate social login/signup
            alert(`Signing up with ${provider.charAt(0).toUpperCase() + provider.slice(1)}...`);
            // In a real application, this would redirect to OAuth provider
            console.log(`Initiating ${provider} signup`);
        }
    </script>
</body>

</html>
